---
name: Bug Report
description: Create a bug report to help us improve.
body:
  - type: markdown
    attributes:
      value: >
        WayShine is Linux-only. If the issue also reproduces on unmodified
        Sunshine, open it upstream at https://github.com/LizardByte/Sunshine.
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
  - type: checkboxes
    attributes:
      label: Is your issue described in the documentation?
      description: Please read the upstream Sunshine docs and WayShine fork notes.
      options:
        - label: I have read the documentation
  - type: dropdown
    attributes:
      label: Does the issue reproduce on unmodified Sunshine?
      description: This helps decide whether the fix belongs upstream or in WayShine.
      options:
        - "Yes, it reproduces upstream"
        - "No, it only reproduces in WayShine"
        - "I have not tested upstream yet"
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: |
        A clear and concise description of the bug, list the reproduction steps.
        :warning: Errors in log messages are NOT bugs. Read the message and fix what it's telling you. :warning:
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the bug here.
  - type: dropdown
    id: os
    attributes:
      label: Host Operating System
      description: What version operating system are you running the software on?
      options:
        - Docker
        - Linux
        - other Linux container or derivative
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating System Version
      description: Provide the version of the operating system. Additionally a build number would be helpful.
    validations:
      required: true
  - type: dropdown
    id: os-architecture
    attributes:
      label: Architecture
      options:
        - amd64/x86_64
        - arm64/aarch64
        - other, n/a
    validations:
      required: true
  - type: dropdown
    id: package_type
    attributes:
      label: Package
      description: The package you installed
      options:
        - Linux - AppImage
        - Linux - deb
        - Linux - Docker
        - Linux - flathub/flatpak
        - Linux - rpm
        - Linux - self built
        - other Linux package
    validations:
      required: true
  - type: dropdown
    id: graphics_type
    attributes:
      label: GPU Type
      description: The type of the installed graphics card.
      options:
        - AMD
        - Intel
        - NVIDIA
        - none (software encoding)
        - n/a
    validations:
      required: true
  - type: input
    id: graphics_model
    attributes:
      label: GPU Model
      description: The model of the installed graphics card.
    validations:
      required: true
  - type: input
    id: graphics_driver
    attributes:
      label: GPU Driver/Mesa Version
      description: The driver/mesa version of the installed graphics card.
    validations:
      required: true
  - type: dropdown
    id: capture_method
    attributes:
      label: Capture Method
      description: The capture method being used.
      options:
        - KMS (Linux)
        - NvFBC (Linux)
        - wlroots (Linux)
        - X11 (Linux)
        - XDG Portal Grab (Linux)
    validations:
      required: false
  - type: textarea
    id: apps
    attributes:
      label: Apps
      description: |
        If this is an issue with launching a game or app, please copy and paste your `apps.json` file.
      render: json
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: |
        Copy and paste logs from web-ui troubleshooting page.
        This will be automatically formatted into code, so no need for backticks.
        :warning: If full logs are not provided, the issue will be closed! :warning:
      render: shell
    validations:
      required: false
  - type: input
    id: logs_link
    attributes:
      label: Online logs
      description: |
        If logs are too long to include in the field above,
        create a [gist](https://gist.github.com/) of the logs and paste the link here.
    validations:
      required: false
